name: Verify corrected Samvev payload

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-corrected-payload.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify corrected payload segments
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c - <<'EOF'
          a6db01f4410c2071abbd3e0293b62ba61a705fa2dcdc5b849b311339344e87b1  .bootstrap/fix02.00
          bb96bd60ad202ccd6106042252b1e1ce58fdab0082683ed28a1e49a7e56c8f1f  .bootstrap/fix02.01
          ebf8e00b468528cd4453dc84ad468d5ab05bd7fd918db4fb2321bb1ae035fab2  .bootstrap/fix02.02
          369cc5b419f382a97866a885ab80dc8fb8c8a20171de29c78a25a8fd1e5241e8  .bootstrap/fix02.03
          8fa5374ebd472888975b9b9f17c73046fb0309865b25512b207b855bd180ddf7  .bootstrap/fix05.00
          d59434f65fe66c5450790acb71bc33de1c3deb39205cc2460b0e39465614362b  .bootstrap/fix05.01
          71ad65658635b85d1b92f133ea33d6bab7cea7b9174b9095030c9ae700248934  .bootstrap/fix05.02
          2675ee9fb3a5e7cd9a5cc2b8c2b29d0813cf0f5fd744647c3adeb2a4c634fd04  .bootstrap/fix05.03
          660b08e8d20096f4a6a809c6b134319c71636854c38c19ccde3e726a073b7f76  .bootstrap/fix07.00
          3e9e9dde5079a9e64fec00c1d382cb8c3e0916b56fca5d61cf199fa725393a3e  .bootstrap/fix07.01
          5b050b6486b739dd10b55c4defc23bd89a0e4326f83f53f147b6e80ac90a2048  .bootstrap/fix07.02
          0595db3025808453762dc762039f9b262e9b3c46b02881778230fd11ad579ce8  .bootstrap/fix07.03
          f34c347bafefc13cd1217ba5a145a55126d38f6de2f0c63a97a9673c00106895  .bootstrap/fix08.00
          e230249c892020ca45f4bcab615f4e0008f0cc964c77868c70753f2cb00b1239  .bootstrap/fix08.01
          4af835edc3b5829ec4b6858f8a7ad4e33d6d21be5794eff6a4c3d00ba840acf6  .bootstrap/fix08.02
          d263c5e0633fd68ba2bf201a76b0eda912f29db2cc02ebb1fba7e4f5c56e6640  .bootstrap/fix08.03
          EOF

      - name: Reconstruct and verify complete archive
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .bootstrap/payload.part00
            cat .bootstrap/payload.part01
            cat .bootstrap/fix02.{00..03}
            cat .bootstrap/payload.part03
            cat .bootstrap/payload.part04
            cat .bootstrap/fix05.{00..03}
            cat .bootstrap/payload.part06
            cat .bootstrap/fix07.{00..03}
            cat .bootstrap/fix08.{00..03}
            cat .bootstrap/payload.part09
          } | base64 --decode > /tmp/samvev-foundation.tar.gz
          echo "dd829d0c1704ec142a07d0034c3c505e5bd634714aa12fc8f1f451c7ea228ca4  /tmp/samvev-foundation.tar.gz" | sha256sum -c -
          test "$(wc -c < /tmp/samvev-foundation.tar.gz)" -eq 97760
          tar -tzf /tmp/samvev-foundation.tar.gz >/dev/null
