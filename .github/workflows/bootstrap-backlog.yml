name: Bootstrap Samvev backlog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-backlog.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: samvev-backlog-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create labels, milestones and seed issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["REPOSITORY"]
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "samvev-backlog-bootstrap",
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(api + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", "replace")
                  raise RuntimeError(f"GitHub API {method} {path} failed: {exc.code} {detail}") from exc

          with open("scripts/issues.json", encoding="utf-8") as handle:
              raw = json.load(handle)
          issues = raw.get("issues", []) if isinstance(raw, dict) else raw
          if not isinstance(issues, list) or not issues:
              raise RuntimeError("scripts/issues.json contains no seed issues")

          existing_issues = request("GET", "/issues?state=all&per_page=100")
          existing_titles = {item["title"] for item in existing_issues if "pull_request" not in item}
          existing_labels = {item["name"] for item in request("GET", "/labels?per_page=100")}
          milestones = {item["title"]: item["number"] for item in request("GET", "/milestones?state=all&per_page=100")}

          colors = {
              "area:ai": "8250df", "area:design": "bf3989", "area:homey": "00aaff",
              "area:ios": "0969da", "area:security": "cf222e", "area:voice": "6f42c1",
              "type:bug": "d73a4a", "type:docs": "0075ca", "type:feature": "a2eeef",
              "priority:critical": "b60205", "priority:high": "d93f0b", "priority:medium": "fbca04",
              "good first issue": "7057ff",
          }

          def normalise_labels(value):
              if not value:
                  return []
              if isinstance(value, str):
                  return [part.strip() for part in value.split(",") if part.strip()]
              result = []
              for item in value:
                  result.append(item.get("name") if isinstance(item, dict) else str(item))
              return [item for item in result if item]

          all_labels = sorted({label for item in issues for label in normalise_labels(item.get("labels"))})
          for label in all_labels:
              if label in existing_labels:
                  continue
              try:
                  request("POST", "/labels", {"name": label, "color": colors.get(label, "ededed")})
                  existing_labels.add(label)
              except RuntimeError as exc:
                  if "already_exists" not in str(exc):
                      raise

          milestone_titles = []
          for item in issues:
              value = item.get("milestone") or item.get("milestone_title")
              if isinstance(value, dict):
                  value = value.get("title")
              if value and value not in milestone_titles:
                  milestone_titles.append(value)
          for title in milestone_titles:
              if title not in milestones:
                  created = request("POST", "/milestones", {"title": title, "state": "open"})
                  milestones[title] = created["number"]

          created_count = 0
          skipped_count = 0
          for item in issues:
              title = item["title"].strip()
              if title in existing_titles:
                  skipped_count += 1
                  continue
              milestone = item.get("milestone") or item.get("milestone_title")
              if isinstance(milestone, dict):
                  milestone = milestone.get("title")
              payload = {
                  "title": title,
                  "body": item.get("body", ""),
                  "labels": normalise_labels(item.get("labels")),
              }
              if milestone:
                  payload["milestone"] = milestones[milestone]
              request("POST", "/issues", payload)
              existing_titles.add(title)
              created_count += 1

          print(f"Seed issues: {len(issues)}; created: {created_count}; already present: {skipped_count}")
          PY

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bootstrap-backlog.yml
          git commit -m "chore: complete initial backlog bootstrap"
          git push origin HEAD:main
